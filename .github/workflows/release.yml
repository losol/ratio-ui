name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or tag
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check for pending changesets
        id: changesets
        run: |
          COUNT=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT pending changeset(s)"

      # Pending changesets -> open / update the "Version Packages" PR.
      - name: Create or update version PR
        if: steps.changesets.outputs.count != '0'
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: pnpm changeset:version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No pending changesets (e.g. the version PR was just merged) -> tag the
      # released versions, cut a GitHub release per tag, and hand each package
      # to its publish workflow.
      #
      # Shell rather than changesets/action: the action decides what was
      # released by grepping the CLI's output for "New tag: ", and
      # @changesets/cli 3 prints "Created git tags:" instead. Since the v3 bump
      # every release was therefore tagged inside the runner and thrown away
      # with it — 2.20.0 through 2.22.0 never reached npm, while the workflow
      # stayed green. Here the tags are the source of truth: whatever
      # `changeset git-tag` newly created is what gets pushed.
      - name: Tag released packages
        if: steps.changesets.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags --force --quiet

          git tag --list | sort > /tmp/tags-before
          pnpm changeset:tag
          git tag --list | sort > /tmp/tags-after
          comm -13 /tmp/tags-before /tmp/tags-after > /tmp/tags-new

          if [ ! -s /tmp/tags-new ]; then
            echo "No new tags — every package version is already released."
            exit 0
          fi

          UNDISPATCHED=""
          while read -r TAG; do
            [ -n "$TAG" ] || continue
            NAME="${TAG%@*}"        # @eventuras/ratio-ui
            VERSION="${TAG##*@}"    # 2.22.0
            SLUG="${NAME##*/}"      # ratio-ui

            echo "::group::${TAG}"
            git push origin "refs/tags/${TAG}"

            # A missing release is cosmetic, and re-runs hit "already exists" —
            # warn, don't fail.
            gh release create "$TAG" --title "${SLUG} v${VERSION}" --generate-notes \
              || echo "::warning::Could not create the GitHub release for ${TAG}"

            # A tag pushed with GITHUB_TOKEN does not trigger workflows, so the
            # publish workflow's tag trigger never fires here. Dispatching it
            # explicitly does run — that API call is not subject to the same
            # restriction. This is the last link to npm: if it fails, the
            # package is tagged but never published, which is precisely the
            # silence this workflow was rewritten to end. Collect the failures
            # so one bad package still lets the others through, then go red.
            if [ -f ".github/workflows/${SLUG}-publish.yml" ]; then
              if ! gh workflow run "${SLUG}-publish.yml" -f tag="$TAG"; then
                echo "::error::Could not dispatch ${SLUG}-publish.yml for ${TAG} — tagged, not published."
                UNDISPATCHED="${UNDISPATCHED} ${TAG}"
              fi
            else
              echo "::warning::No publish workflow for ${NAME} — ${TAG} is tagged but will not reach npm."
            fi
            echo "::endgroup::"
          done < /tmp/tags-new

          if [ -n "$UNDISPATCHED" ]; then
            echo "::error::Publish was not dispatched for:${UNDISPATCHED}"
            echo "Re-run manually: gh workflow run <slug>-publish.yml -f tag=<tag>"
            exit 1
          fi
