packages:
  - packages/*
  - config/*
  - '!**/dist'
  - '!**/node_modules'

# Allow-list of packages whose install scripts may run.
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Supply-chain protection: do not resolve packages published less than
# 10 days ago. Mirrors the window used in the eventuras monorepo.
minimumReleaseAge: 14400
# Storybook is a dev-only dependency (never shipped to consumers) and moves
# fast
minimumReleaseAgeExclude:
  - 'storybook'
  - '@storybook/*'
  - '@next/env@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - next@16.3.1
minimumReleaseAgeStrict: false

peerDependencyRules:
  ignoreMissing:
    - '@types/react'
    - '@types/react-dom'

pmOnFail: ignore
